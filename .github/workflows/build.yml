name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            name: linux-x64
          - os: windows-latest
            name: windows-x64
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build
        run: pyinstaller --noconfirm --clean tanto-browser.spec

      - name: Package (Linux)
        if: runner.os == 'Linux'
        run: |
          cd dist
          zip -r ../tanto-browser-${{ matrix.name }}.zip tanto-browser

      - name: Package (Windows)
        if: runner.os == 'Windows'
        run: Compress-Archive -Path dist/tanto-browser -DestinationPath tanto-browser-${{ matrix.name }}.zip

      - uses: actions/upload-artifact@v4
        with:
          name: tanto-browser-${{ matrix.name }}
          path: tanto-browser-${{ matrix.name }}.zip

      - name: Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: tanto-browser-${{ matrix.name }}.zip
